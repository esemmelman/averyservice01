<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153c51"><title>The Tallit Blessing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&display=swap');
:root{color-scheme:light;font-family:'DM Sans',sans-serif;color:#17394a;background:#f5f2e9}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:42px 24px 28px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#6c7e81}h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:clamp(48px,8vw,76px);margin:17px 0 10px}.intro{color:#65777a;font-size:16px;line-height:1.6}.tallit{display:block;position:relative;width:100%;margin:26px auto 12px;padding:12px;border:1px solid #d8ddd4;border-radius:180px 180px 16px 16px;background:radial-gradient(ellipse at center,#fffdf6,#e9ede6);cursor:pointer;transition:transform .25s,box-shadow .25s}.tallit:hover{transform:translateY(-3px);box-shadow:0 18px 45px #17394a12}.tallit:focus-visible,button:focus-visible{outline:3px solid #bf963e;outline-offset:5px}.tallit svg{display:block;width:100%;height:330px}.play{display:inline-flex;gap:12px;align-items:center;margin-bottom:17px;font-size:13px;letter-spacing:.06em}.play b{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#17394a;color:white}.hebrew{font-family:Georgia,serif;font-size:30px;margin:26px 0 8px}.note{font-size:13px;color:#6c7e81;line-height:1.6}section{max-width:560px;margin:28px auto;padding:24px;background:#fffdf8;border:1px solid #dedfd5;border-radius:16px}h2{font-family:Georgia,serif;font-weight:400;font-size:25px;margin:0 0 10px}button.control,a.download{font:inherit;font-size:14px;padding:12px 18px;border:0;border-radius:8px;background:#17394a;color:white;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}button.secondary{background:#e8ece6;color:#17394a}button:disabled{opacity:.4;cursor:default}audio{width:100%;margin:12px 0}[hidden]{display:none!important}#status{min-height:24px;color:#4e686b;font-size:14px}footer{margin-top:30px;font-size:11px;color:#89938c;letter-spacing:.12em}#recording-state{color:#9e3c35}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
</head>
<body><main>
<div class="eyebrow">A moment of intention</div>
<h1>The Tallit Blessing</h1>
<p class="intro">Click the Tallit to hear the blessing.</p>
<button class="tallit" id="tallit" aria-label="Play the tallit blessing">
<svg viewBox="0 0 760 370" role="img" aria-label="An ivory Jewish tallit prayer shawl with blue stripes and knotted tzitzit fringes">
<defs><linearGradient id="cloth" x2=".8" y2="1"><stop stop-color="#fffef8"/><stop offset=".5" stop-color="#ede8d9"/><stop offset="1" stop-color="#fffdf5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#17394a" flood-opacity=".16"/></filter><pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 1H5M1 0V5" stroke="#918879" stroke-opacity=".09" stroke-width=".5"/></pattern></defs>
<ellipse cx="380" cy="312" rx="251" ry="18" fill="#17394a" opacity=".06"/>
<g filter="url(#shadow)" transform="rotate(-7 380 180)"><path d="M146 92Q244 57 365 80Q488 100 608 68L635 280Q518 314 387 285Q263 261 151 300Z" fill="url(#cloth)" stroke="#d9d3c4"/>
<path d="M146 92Q244 57 365 80Q488 100 608 68L635 280Q518 314 387 285Q263 261 151 300Z" fill="url(#weave)"/>
<g fill="#204e70"><path d="M180 82L189 290L211 286L202 77Z"/><path d="M222 73L232 282L241 281L231 72Z"/><path d="M251 72L261 278L284 278L274 72Z"/><path d="M516 86L537 300L560 297L539 83Z"/><path d="M565 78L587 291L596 289L574 76Z"/><path d="M590 73L613 285L627 282L604 69Z"/></g>
<path d="M329 77Q350 144 405 152Q454 158 474 91" fill="none" stroke="#d2c6a6" stroke-width="17"/><path d="M329 77Q350 144 405 152Q454 158 474 91" fill="none" stroke="#faf7e9" stroke-width="11" stroke-dasharray="3 4"/>
<g fill="none" stroke="#d5cbb6" stroke-width="2" stroke-linecap="round"><path d="M154 298l-8 35m15-36-2 42m6-43 6 35M621 283l5 42m-1-43 9 45m-5-46 15 34M149 96l-12 37m15-28-8 39M607 71l14 28m-10-22 17 34"/><path d="M145 317h17m-18 4h18m463-14 13-2m-13 6 14-2" stroke-width="4"/></g>
<path d="M314 93Q299 173 322 271M491 104Q471 201 505 294" fill="none" stroke="#c7bfac" stroke-opacity=".25" stroke-width="3"/></g>
</svg></button>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<section id="studio" hidden><h2>Make this blessing yours</h2><p class="note">Record your blessing, listen back, and approve it when it feels right.</p><p id="recording-state" role="status"></p><button class="control" id="record">● Start recording</button><button class="control secondary" id="stop" disabled>Stop recording</button><button class="control" id="listen" hidden>▶ Play my recording</button><audio id="review" controls hidden preload="auto"></audio><div id="approval" hidden><button class="control" id="approve">It’s good — use this recording</button><button class="control secondary" id="retry">Record again</button></div><p class="note" id="studio-note"></p></section>
</main><script src="app.js"></script></body></html>
